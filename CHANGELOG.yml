changelog:
  - version: 1.18.2
    date: 2026-03-12
    added:
      - ontap volume delete
    fixed:
    
      - Extract task state evaluation into _evaluate_task_state()
      - Extract update parsing into _iter_state_changes()
      - Isolate filter destruction via _destroy_filter()
      - Improve timeout and retry handling with optional wait hook
      - Reorder parameters (wait before timeout)
      - Replace polling-based task wait with event-driven PropertyCollector The new implementation eliminates sleep-based polling cycles and leverages vSphere's native push notification mechanism for immediate state updates.
      - Event-driven notifications instead of repeated polling loops
      - Isolated PropertyCollector per task for thread/greenlet safety
      - Automatic recovery from socket/SSL timeouts
      - Significantly reduced API calls and CPU usage
      - Better scalability for concurrent task monitoring
      - Event-driven notifications instead of repeated polling loops
      - Isolated PropertyCollector per task for thread/greenlet safety
      - Automatic recovery from socket/SSL timeouts
      - Significantly reduced API calls and CPU usage
      - Better scalability for concurrent task monitoring
      - Replace expensive inventory search in `get_by_morid` with direct ManagedObject
        instantiation (`get_vm_object`). This avoids traversing the entire folder tree
        to find a VM by ID.
      - Cache nested properties (config, guest, hardware) into local variables within
        loops and methods to minimize repeated attribute lookups and potential SOAP
        calls.
      - Improve robustness in hardware parsing by using `getattr` for optional fields
        like `backing` and `connectable`.
      - Remove unused methods and dead code in `guest_utils.py` (e.g., fault_tolerance,
        clone placeholders).
      - Fix mutable default arguments in `nsx_call` and `call` methods to avoid potential
        side effects across calls.
      - Modernize string formatting using f-strings and logging placeholders to resolve
        linter warnings (E713, W1203).

